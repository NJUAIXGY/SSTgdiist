Frontend:
  impl: SST
  clock_ratio: 8
  num_expected_insts: 500000

  Translation:
    impl: NoTranslation
    max_addr: 536870911  # 512 MiB

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 3

  DRAM:
    impl: HBM2
    org:
      preset: HBM2_4Gb
      channel: 1
      rank: 1
    timing:
      preset: HBM2_2Gbps

  Controller:
    impl: Generic
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: OpenRowPolicy
    plugins:

  AddrMapper:
    impl: ChRaBaRoCo

