Frontend:
  impl: SST
  clock_ratio: 8
  num_expected_insts: 500000

  Translation:
    impl: NoTranslation
    max_addr: 536870911  # 512 MiB

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 3

  DRAM:
    impl: DDR5
    org:
      # x16 reduces bankgroup count vs x8 in this model, which can increase conflict
      # sensitivity and potentially amplify the benefit of bank×row locality recovery.
      preset: DDR5_8Gb_x16
      channel: 1
      rank: 1
    timing:
      preset: DDR5_3200C
    # DDR5 device model requires RFM ParamGroup (even if using default BRC=2)
    RFM:
      BRC: 2

  Controller:
    impl: Generic
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: OpenRowPolicy
    plugins:

  AddrMapper:
    impl: MOP4CLXOR

